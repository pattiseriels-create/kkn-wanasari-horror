<div style="margin-top:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)"><div style="font-size:15px">Masukkan Kode Sandi</div><div id="dots" aria-label="Indikator kode"><i></i><i></i><i></i><i></i></div><div id="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}" aria-label="${n}">${n}</button>`).join("")}<button class="e" data-s aria-label="Mode aman">${S.safe?"🛡️ Aman: ON":"🛡️ Mode aman"}</button><button data-k="0" aria-label="0">0</button><button class="e" data-k="d" aria-label="Hapus">Hapus</button></div><div class="mu" style="margin-top:12px">${D.CFG.hint}</div></div>`;tick()}
$("#lock").onclick=e=>{const b=e.target.closest("button");if(!b)return;if("s"in b.dataset){setSafe(!S.safe);buildLock();return}const k=b.dataset.k;if(k===undefined)return;
 if(k==="d")S.pin=S.pin.slice(0,-1);else if(S.pin.length<4)S.pin+=k;$$("#dots i").forEach((d,i)=>d.classList.toggle("f",i<S.pin.length));vib(8);
 if(S.pin.length===4){if(S.pin===D.CFG.pin){setTimeout(()=>{S.pin="";buildHome();show("home");startPings()},200)}else{vib([80,40,80]);$("#dots").classList.add("shake");setTimeout(()=>{S.pin="";buildLock()},450)}}};
function setSafe(v){S.safe=v;$("#phone").classList.toggle("safe",v)}
/* HOME */
function buildHome(){const ic=a=>`<button data-app="${a[0]}" aria-label="${a[1]}"><div class="ic" style="background:${a[3]}">${a[2]}${a[0]==="messages"&&S.unread?`<span class="bd">${S.unread}</span>`:""}</div>${a[1]}</button>`;
$("#home").innerHTML=`<div class="wg"><div class="w"><div class="mu dt"></div><div class="clk" style="font-size:40px;font-weight:300"></div></div><div class="w"><div class="mu">Cuaca</div><div style="font-size:34px;font-weight:300">14°C</div><div class="mu">🌫️ Berkabut</div></div><div class="w" style="grid-column:span 2"><div class="mu">Bukti ditemukan</div><div class="${S.stage>=3?"gl":""}" style="font-size:32px;font-weight:700">${S.found.size} / 9</div><div class="mu">${S.found.size>=5?"Cukup untuk pulang.":"Terus cari. Buka semua aplikasi."}</div></div></div>
<div class="g4">${[APPS[3],APPS[5],APPS[6],APPS[7]].map(ic).join("")}</div><div class="dock">${[APPS[1],APPS[0],APPS[2],APPS[4]].map(ic).join("")}</div>
<button id="pw" aria-label="Kunci kembali" style="position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 44px);font-size:20px">🔒</button>`;tick()}
$("#home").onclick=e=>{const a=e.target.closest("[data-app]");if(a)openApp(a.dataset.app);if(e.target.closest("#pw")){buildLock();show("lock")}};
function openApp(id){S.opened.add(id);if(id==="messages")S.unread=0;S.app=id;S.sub=null;S.card=null;render();show("app");buildHome();if(id==="calendar"&&S.opened.size>=8)0}
$("#hi").onclick=()=>{S.tok++;S.app=null;show("home");buildHome()};
const hdr=(t,b)=>`<div class="hd">${b?`<button data-back aria-label="Kembali" style="color:#0a84ff">‹ Kembali</button>`:""}</div>${t?`<h1 class="t ${S.stage>=3&&t.length<12?"gl":""}">${t}</h1>`:""}`;
function render(){$("#body").innerHTML=(V[S.app]||(()=>""))();$("#body").scrollTop=0;if(S.app==="messages"&&S.sub)chat()}
/* tile foto */
const tile=p=>`<div style="width:100%;height:100%;background:linear-gradient(145deg,hsl(${p.h},35%,22%),hsl(${p.h+40},30%,8%));display:flex;align-items:center;justify-content:center;font-size:inherit">${p.src?`<img src="${p.src}" alt="${esc(p.c)}" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover" onerror="fb(this)">`:p.e}</div>`;
function fb(e){const d=document.createElement("div");d.className="fb";d.innerHTML='<span>Gambar gagal dimuat</span><button style="color:#0a84ff">Coba lagi</button>';d.querySelector("button").onclick=()=>{const s=e.src;e.src="";e.src=s;d.replaceWith(e)};e.replaceWith(d)}
const V={
messages(){if(S.sub){const g=S.sub==="g";return `<div class="hd" style="border-bottom:.5px solid #2c2c2e"><button data-back aria-label="Kembali" style="color:#0a84ff">‹</button><b class="${S.stage>=4?"gl":""}">${g?D.CFG.group:D.NAMES[S.sub]}</b></div><div id="msgs"></div><div id="ch" class="ch"></div>`}
 const L=[["g","🌿",D.CFG.group,D.GROUP[D.GROUP.length-1][1]],...["z","r","e","n"].map(k=>[k,"💬",D.NAMES[k],D.PRIV[k].slice(-1)[0][1]])];
 return hdr("Messages")+L.map(l=>`<button class="row" data-open="${l[0]}"><div class="av">${l[1]}</div><div style="min-width:0;flex:1"><b>${esc(l[2])}</b><div class="mu" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l[3])}</div></div>${l[0]==="g"&&S.unread?'<span style="width:10px;height:10px;border-radius:50%;background:#0a84ff"></span>':""}</button>`).join("")},
phone(){if(S.card!==null){return hdr("",1)+`<div style="text-align:center;padding:30px"><div class="av" style="width:90px;height:90px;font-size:44px;margin:auto">❓</div><h1 class="t gl">Nomor Tidak Dikenal</h1><button data-dial aria-label="Telepon" style="background:#30d158;border-radius:50%;width:64px;height:64px;font-size:26px">📞</button></div>`}
 return hdr("Recents")+D.CALLS.map((c,i)=>`<button class="row" data-call="${i}"><div class="av">${c[3]?"❓":"👤"}</div><div style="flex:1"><b style="color:${c[3]?"#ff453a":"#fff"}">${c[0]}</b><div class="mu">${c[3]?"Tak terjawab":"Keluar"} · ${c[2]}</div></div><span class="mu">${c[1]}</span></button>`).join("")},
photos(){const A=S.sub==="del"?D.DELETED:D.PHOTOS;return hdr(S.sub==="del"?"Dihapus Baru-baru Ini":"Photos")+`<div style="display:flex;gap:8px;padding:0 16px 10px"><button data-alb="rec" style="padding:0 16px;border-radius:20px;background:${S.sub!=="del"?"#fff":"#2c2c2e"};color:${S.sub!=="del"?"#000":"#fff"};min-height:36px">Recents</button><button data-alb="del" style="padding:0 16px;border-radius:20px;background:${S.sub==="del"?"#fff":"#2c2c2e"};color:${S.sub==="del"?"#000":"#fff"};min-height:36px">Dihapus 🗑️</button></div><div class="pg">${A.map((p,i)=>`<button data-ph="${i}" aria-label="${esc(p.c)}">${tile(p)}</button>`).join("")}</div>`},
notes(){if(S.sub!==null){const n=D.NOTES[S.sub];if(n.lock&&!S.unlocked)return hdr("",1)+`<h1 class="t">${n.t}</h1><div style="padding:16px"><p class="mu">Catatan ini terkunci. Petunjuk: tahun di foto lama.</p><input class="in" id="pw2" aria-label="Kata sandi" placeholder="Kata sandi"><button data-unl style="margin-top:10px;background:#ffd60a;color:#000;border-radius:12px;width:100%">Buka</button></div>`;
  let b=n.b;if(S.sub===2&&S.flag.loteng==="yes")b+="\n\n[Ditambahkan setelah loteng] Tidak ada apa-apa di sana. Hanya kursi bus yang berderet. Kenapa ada kursi bus?";return hdr("",1)+`<h1 class="t">${n.t}</h1><div class="note">${esc(b)}</div>`}
 return hdr("Notes")+D.NOTES.map((n,i)=>`<button class="row" data-note="${i}"><b style="flex:1">${n.t}</b><span class="mu">${n.lock&&!S.unlocked?"🔒":"›"}</span></button>`).join("")},
maps(){if(S.sub!==null){const p=D.PLACES[S.sub];if(p[2]&&!S.found.has("bus"))setTimeout(()=>clue("bus"),0);return hdr("",1)+`<div style="padding:16px"><h1 class="t" style="padding:0">${p[0]}</h1><p>${p[1]}</p>${S.sub===4?`<button data-final style="background:#30d158;color:#000;border-radius:14px;width:100%;margin-top:16px;font-weight:700">Telepon pulang</button>`:""}</div>`}
 return hdr("Maps")+`<div style="height:130px;margin:0 16px 10px;border-radius:16px;background:radial-gradient(circle at 60% 50%,#1d3a52,#0b1621)"></div>`+D.PLACES.map((p,i)=>`<button class="row" data-pl="${i}"><b>${p[0]}</b></button>`).join("")},
memos(){return hdr("Voice Memos")+D.VMS.map((m,i)=>`<div class="row" style="flex-direction:column;align-items:flex-start"><b>${m.t}</b><button data-vm="${i}" aria-label="Putar rekaman" style="color:#ff453a;min-height:36px">▶ Putar</button><div class="note" style="padding:0;font-size:14px;color:#bbb" id="tr${i}"></div></div>`).join("")},
calendar(){return hdr("Calendar")+D.EVENTS.map((e,i)=>`<button class="row" data-ev="${i}"><div class="av" style="border-radius:12px;font-size:12px;background:#ff453a">${e[0]}</div><b>${e[1]}</b></button>`).join("")},
settings(){return hdr("Settings")+`<button class="row" data-own><div class="av">👤</div><div><b>${S.ver>=1?D.CFG.ownerReal:D.CFG.ownerShown}</b><div class="mu">Ketuk untuk detail Apple ID</div></div></button><div class="row"><span style="flex:1">Mode aman (kurangi efek)</span><button data-safe style="color:#0a84ff">${S.safe?"ON":"OFF"}</button></div><div class="row"><span style="flex:1">Bukti</span><span class="mu">${S.found.size}/9</span></div>${S.ver?`<div class="note mu">Apple ID terdaftar atas nama ${D.CFG.ownerReal}.</div>`:""}`}};
/* CHAT */
const bub=(m,g)=>{const o=m[3]||{},u=m[0]==="a",nm=D.NAMES[S.rn&&S.rn[m[0]]?"x":m[0]];let c=m[1]===null?"Pesan ini telah dihapus":o.p!==undefined?`<div class="ph" style="background:linear-gradient(145deg,hsl(${D.PHOTOS[o.p].h},35%,22%),#0a0a0e)">${D.PHOTOS[o.p].e}</div>`:o.v?`<div class="wv"><button data-vn aria-label="Putar pesan suara" style="min-height:30px;min-width:30px">▶</button><s></s>${o.v}</div>`:esc(m[1]);
 return (g&&!u?`<div class="nm ${nm==="Nomor Tidak Dikenal"?"gl":""}">${nm}</div>`:"")+`<div class="b ${m[1]===null?"d":u?"u":"o"}">${c}${o.t?`<span class="tp">${o.t}</span>`:""}</div>`};
function chat(){const my=++S.tok,box=$("#msgs"),sc=()=>{$("#body").scrollTop=1e6};S.rn={};
 if(S.sub!=="g"){const L=D.PRIV[S.sub];box.innerHTML=L.map(m=>`<div class="b ${m[0]==="u"?"u":"o"}">${esc(m[1])}</div>`).join("");if(S.sub==="z")stage(S.stage);return}
 let i=0;const play=!S.played;
 (function step(){if(my!==S.tok)return;const m=D.GROUP[i];if(!m){S.played=true;S.unread=0;return}
  if(m[0]==="#"){box.insertAdjacentHTML("beforeend",`<div class="dv">${m[1]}</div>`);stage(m[2]);i++;return setTimeout(step,play?300:0)}
  if(m[0]==="?"){const c=D.CH[m[1]];if(S.flag[m[1]]){box.insertAdjacentHTML("beforeend",bub(["a",c.o.find(x=>x[2]===S.flag[m[1]])[1],m[2]],1));i++;return step()}
   $("#ch").innerHTML=c.o.map((x,k)=>`<button data-pick="${k}">${esc(x[0])}</button>`).join("");$("#ch").onclick=e=>{const b=e.target.closest("[data-pick]");if(!b)return;const x=c.o[+b.dataset.pick];S.flag[m[1]]=x[2];$("#ch").innerHTML="";box.insertAdjacentHTML("beforeend",bub(["a",x[1],m[2]],1));sc();i++;setTimeout(step,500)};sc();return}
  const o=m[3]||{};if(o.rename)S.rn[o.rename]=1;
  const put=()=>{box.insertAdjacentHTML("beforeend",bub(m,1));i++;sc();vib(4);setTimeout(step,play?(m[0]==="a"?500:700):0)};
  if(play&&m[0]!=="a"){box.insertAdjacentHTML("beforeend",'<div class="typ"><i></i><i></i><i></i></div>');sc();setTimeout(()=>{if(my!==S.tok)return;const t=$(".typ");t&&t.remove();put()},600)}else put()})()}
/* EVENT delegasi */
$("#body").addEventListener("click",e=>{const t=e.target.closest("button,[data-open]");if(!t)return;const d=t.dataset;
 if("back"in d){if(S.card!==null)S.card=null;else S.sub=null;S.tok++;render()}
 else if(d.open){S.sub=d.open;render()}
 else if(d.alb){S.sub=d.alb==="del"?"del":null;render()}
 else if(d.ph!==undefined)modal(+d.ph)
 else if(d.note!==undefined){S.sub=+d.note;render()}
 else if("unl"in d){if($("#pw2").value.trim()===D.CFG.lockPass){S.unlocked=true;clue("lock");render()}else{vib([60,40,60]);$("#pw2").value="";$("#pw2").placeholder="Salah. Coba lagi."}}
 else if(d.pl!==undefined){S.sub=+d.pl;render()}
 else if("final"in d)ending()
 else if(d.vm!==undefined){const m=D.VMS[+d.vm],tr=$("#tr"+d.vm);tr.textContent="";let k=0;const iv=setInterval(()=>{tr.textContent=m.s.slice(0,k+=3);if(k>m.s.length){clearInterval(iv);if(m.clue)clue(m.clue)}},40)}
 else if(d.ev!==undefined){toast("Tanggal di kalender: 5 September");if(+d.ev>=1&&S.opened.size>0)clue("cal")}
 else if(d.call!==undefined){S.card=+d.call;render()}
 else if("dial"in d)callUI()
 else if("own"in d){S.ver++;render();clue("name")}
 else if("safe"in d){setSafe(!S.safe);render()}
 else if("vn"in d){const s=t.nextElementSibling;let p=0;t.textContent="⏸";const iv=setInterval(()=>{p+=8;s.style.setProperty("--p",p+"%");if(p>=100){clearInterval(iv);t.textContent="▶";clue("vm")}},180)}});
/* modal foto */
function modal(i){const A=S.sub==="del"?D.DELETED:D.PHOTOS,n=(i+A.length)%A.length,p=A[n],m=$("#modal");S.seen.add(p.c);if(p.clue)clue(p.clue);if(S.seen.size>=3)clue("ts");
 m.classList.add("on");m.innerHTML=`<div class="hd"><button data-x aria-label="Tutup" style="color:#0a84ff">Tutup</button></div><div style="flex:1;font-size:120px;min-height:0">${tile(p)}</div><div style="text-align:center;padding:10px"><b>${esc(p.c)}</b><div class="mu">${p.d}</div></div><div style="display:flex;justify-content:space-between;padding:0 24px 24px"><button data-pv aria-label="Foto sebelumnya" style="font-size:26px">‹</button><button data-nx aria-label="Foto berikutnya" style="font-size:26px">›</button></div>`;
 m.onclick=e=>{const b=e.target.closest("button");if(!b)return;if("x"in b.dataset)m.classList.remove("on");if("pv"in b.dataset)modal(n-1);if("nx"in b.dataset)modal(n+1)};let x0=0;m.ontouchstart=e=>x0=e.touches[0].clientX;m.ontouchend=e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)modal(n+(d<0?1:-1))}}
/* panggilan 03.03: hasil beda tiap hari */
function callUI(){const c=S.card,el=$("#call"),day=D.CALLS[c][2],lines=["Nomor yang Anda tuju tidak aktif.","(statis) ...Aliya...","(suara anak kecil) kamu sudah lama di sini.","(napas) pulanglah."];clue("call");el.classList.add("on");el.innerHTML=`<div class="av" style="width:100px;height:100px;font-size:48px">❓</div><h2 class="gl" style="margin:0">Nomor Tidak Dikenal</h2><div class="mu">${day} · memanggil…</div><p class="${S.safe?"":"flk"}" style="min-height:48px;color:#ccc" id="cl"></p><button id="ce" aria-label="Akhiri panggilan" style="background:#ff3b30;border-radius:50%;width:70px;height:70px;font-size:26px;margin-top:30px">📵</button>`;vib(30);
 const L=lines[(+day.replace(/\D/g,"")+c)%4];setTimeout(()=>{const p=$("#cl");if(p)p.textContent=L},2000);$("#ce").onclick=()=>el.classList.remove("on")}
/* pesan masuk terjadwal */
const PINGS=[["Aliza","Sudah buka semua aplikasi?"],["Nomor Tidak Dikenal","Aliya, jangan ke loteng."],["Ridha","Kenapa kas tidak berkurang?"],["Elisha","aku denger langkah lagi 😭"]];
let pt;function startPings(){clearInterval(pt);pt=setInterval(()=>{const home=$("#home").classList.contains("on");if(!home)return;const p=PINGS[Math.random()*4|0];S.unread++;$("#banner").innerHTML=`<div class="ban" style="width:100%"><span style="font-size:24px">💬</span><div><b>${p[0]}</b><span>${p[1]}</span></div></div>`;$("#banner").classList.add("on");vib([20,30,20]);buildHome();setTimeout(()=>$("#banner").classList.remove("on"),4500)},25000)}
$("#banner").onclick=()=>{$("#banner").classList.remove("on");openApp("messages")};
/* akhir cerita */
function ending(){const n=S.found.size,e=$("#end");let k=n>=5?"a":"b";
 const opts=[["Terima kenyataan dan pulang","a"],["Tolak, tetap di posko","b"]];if(n>=9&&S.unlocked)opts.push(["Buka mata","c"]);
 e.classList.add("on");e.innerHTML=`<h1 class="t gl">Jembatan, 05.09</h1><p>Bukti terkumpul: ${n}/9. ${n>=5?"Kamu sudah cukup tahu.":"Kamu belum cukup tahu, kamu mungkin belum siap."}</p>${opts.map(o=>`<button data-e="${o[1]}" style="border:1.5px solid #0a84ff;border-radius:16px;padding:10px">${o[0]}</button>`).join("")}`;
 e.onclick=ev=>{const b=ev.target.closest("[data-e]");if(b){let r=b.dataset.e;if(r==="a"&&n<5)r="b";const x=D.ENDINGS[r];e.innerHTML=`<h1 class="t">${x.t}</h1><p style="line-height:1.6">${x.b}</p><button data-r style="background:#fff;color:#000;border-radius:16px;padding:10px">Main lagi</button>`}else if(ev.target.closest("[data-r]")){e.classList.remove("on");init();$("#phone").classList.remove("t3");$("#sS").textContent="▂▄▆";buildLock();show("lock");clearInterval(pt)}}}
buildLock();buildHome();tick();
</script></body></html>
